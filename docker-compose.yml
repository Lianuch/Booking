services:

  frontend:
    container_name: docker_frontend
    build: ./frontend
    env_file:
      - ./frontend/.env
    command : npm run dev 
    ports:
      - "5000:5000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      
    environment:
    - CHOKIDAR_USEPOLLING=true

    depends_on:
      backend:
        condition: service_started

  backend:
    container_name: docker_backend
    build: ./backend

    env_file:
      - .env

    command: npm run dev

    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules

    environment:
    - CHOKIDAR_USEPOLLING=true

    depends_on:
      postgres_db:
        condition: service_healthy

    restart: unless-stopped

  postgres_db:
    image: postgres:17
    container_name: postgres_docker

    env_file:
      - .env

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

volumes:
  postgres_data: